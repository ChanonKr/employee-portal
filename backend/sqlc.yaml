version: "2"
sql:
  - engine: postgresql
    schema: pkg/database/migrations
    queries: pkg/database/queries
    gen:
      go:
        package: sqlc
        out: pkg/database/sqlc
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: jsonb
            go_type:
              type: "[]byte"
          - db_type: jsonb
            nullable: true
            go_type:
              type: "[]byte"
