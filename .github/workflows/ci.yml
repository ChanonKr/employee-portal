name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi

      - name: go vet
        run: go vet -tags integration ./...

      - name: sqlc generated code is up to date
        run: docker run --rm -v "$PWD":/src -w /src sqlc/sqlc:1.30.0 diff

      - name: Unit tests
        run: go test -race ./...

      - name: Integration tests (PostgreSQL 17 via testcontainers)
        run: go test -race -tags integration -count=1 ./tests/integration/

      - name: Docker image builds
        run: docker build -t employee-portal-api .

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
