# Local development only. Passwords here are public demo values.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: portal
      POSTGRES_USER: owner
      POSTGRES_PASSWORD: owner
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owner -d portal"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports: ["5432:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./backend/db-init:/docker-entrypoint-initdb.d:ro

  migrate:
    image: migrate/migrate:v4.19.1
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - ./backend/pkg/database/migrations:/migrations:ro
    command: ["-path=/migrations", "-database=postgres://owner:owner@postgres:5432/portal?sslmode=disable", "up"]

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/portal?sslmode=disable
      # Deletes history older than HISTORY_RETENTION_DAYS (role created by db-init).
      RETENTION_DATABASE_URL: postgres://retention:retention@postgres:5432/portal?sslmode=disable
      # Trust X-Forwarded-For from the web (nginx) container on the compose network,
      # so rate limits see the real client IP.
      TRUSTED_PROXIES: 172.16.0.0/12
      # E2E runs set this higher (make e2e); real use keeps the default of 5/min.
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-5}
    depends_on:
      migrate: { condition: service_completed_successfully }
    ports: ["8080:8080"]
    volumes:
      - uploads:/data/uploads

  web:
    build: ./frontend
    depends_on: [api]
    ports: ["5173:80"]

volumes:
  pg-data: {}
  uploads: {}
